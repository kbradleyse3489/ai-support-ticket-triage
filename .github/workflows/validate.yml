name: Validate AI Ticket Triage
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verified project dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify project manifest
        run: python scripts/verify_release.py
      - name: Run all 26 tests including both Streamlit AppTest interactions
        run: python -m pytest -q tests
