name: Publish Verified AI Ticket Triage
on:
  push:
    paths:
      - '.release_chunks/**'
      - '.github/workflows/publish-project.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '.github/workflows/publish-project.yml'
      - name: Restore complete approved source and verify archive
        run: |
          python - <<'PY'
          import base64, hashlib, io, shutil, pathlib, zipfile
          chunks = sorted(pathlib.Path('.release_chunks').glob('chunk_*.b64'))
          assert len(chunks) == 21, f'Expected 21 source pieces, found {len(chunks)}'
          archive = base64.b64decode(''.join(p.read_text(encoding='ascii') for p in chunks), validate=True)
          expected = '377c8093ff725d9bf612cf7cf65f6a00bc8034d43cd9bc2853b8b00a57a2f19f'
          assert hashlib.sha256(archive).hexdigest() == expected, 'Archive integrity mismatch'
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              members = z.namelist()
              assert len(members) == 83, f'Expected 83 files, got {len(members)}'
              for name in members:
                  p = pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts, f'Unsafe path: {name}'
              z.extractall('.')
          shutil.rmtree('.release_chunks')
          pathlib.Path('.github/workflows/publish-project.yml').unlink()
          print('Verified complete project archive and restored 83 files.')
          PY
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify all source hashes
        run: python scripts/verify_release.py
      - name: Run all 26 tests including both official Streamlit AppTests
        run: python -m pytest -q tests
      - name: Commit verified complete source to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset HEAD -- .github/workflows
          git commit -m 'Publish complete tested AI support ticket triage project'
          git push origin HEAD:main
